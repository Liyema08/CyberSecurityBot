name: .NET CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x
    
    - name: List files (debugging)
      run: dir /s
    
    - name: Restore dependencies
      run: dotnet restore CyberSecurityBot/CyberSecurityBot.csproj
    
    - name: Build
      run: dotnet build CyberSecurityBot/CyberSecurityBot.csproj --configuration Release --no-restore
